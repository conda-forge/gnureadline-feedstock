{% set name = "gnureadline" %}
{% set version = "8.3.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gnureadline-{{ version }}.tar.gz
  sha256: 0972392bd2f31244e2d981178246fe8b729c8766454fdaeb275946ac47b7e9fd

build:
  number: 0
  skip: true  # [not osx]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

test:
  imports:
    - gnureadline
    - override_readline
    - readline
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://github.com/ludwigschwardt/python-gnureadline
  license: GPL-3.0-only
  license_family: GPL
  license_file:
    - LICENSE
    - rl/readline-lib/COPYING
  summary: The standard Python readline extension statically linked against the GNU readline library

extra:
  recipe-maintainers:
    - ocefpaf
    - scopatz
